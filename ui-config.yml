---
type: showroom
default_width: 50
view_switcher:
  enabled: true
  default_mode: split
persist_url_state: true
tabs:
  - name: Terminal
    path: '/tty1'
    port: '443'
  - name: OCP Console
    path: '/console/'
    port: '443'
  - name: ArgoCD (Cluster)
    url: 'https://openshift-gitops-server-openshift-gitops.${DOMAIN}'
    external: true
  - name: ArgoCD (Apps)
    url: 'https://rhdh-gitops-server-rhdh-gitops.${DOMAIN}'
    external: true
